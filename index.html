<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Incremental RPG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>⚔️ Arena Incremental RPG</h1>

    <div class="panel">
      <h2>Player</h2>
      <p>Level: <span id="level"></span></p>
      <p>XP: <span id="xp"></span> / <span id="xpNeeded"></span></p>
      <p>Gold: <span id="gold"></span></p>
      <p>HP: <span id="hp"></span> / <span id="maxHp"></span></p>
      <p>Attack: <span id="attack"></span></p>
      <p>Defense: <span id="defense"></span></p>
      <p>Crit Chance: <span id="crit"></span>%</p>
    </div>

    <div class="panel">
      <h2>Enemy</h2>
      <p>Name: <span id="enemyName"></span></p>
      <p>Level: <span id="enemyLevel"></span></p>
      <p>HP: <span id="enemyHp"></span> / <span id="enemyMaxHp"></span></p>
      <p>Attack: <span id="enemyAttack"></span></p>
    </div>

    <div class="buttons">
      <button onclick="attackEnemy()">⚔️ Attack</button>
      <button onclick="healPlayer()">❤️ Heal</button>
      <button onclick="toggleAutoBattle()">🤖 Toggle Auto Battle</button>
    </div>

    <div class="panel">
      <h2>Upgrades</h2>
      <button onclick="upgradeAttack()">Attack (Cost <span id="attackCost"></span>)</button>
      <button onclick="upgradeDefense()">Defense (Cost <span id="defenseCost"></span>)</button>
      <button onclick="upgradeMaxHp()">HP (Cost <span id="hpCost"></span>)</button>
      <button onclick="upgradeCrit()">Crit (Cost <span id="critCost"></span>)</button>
    </div>

    <div class="panel">
      <h2>Prestige</h2>
      <p>Points: <span id="prestige"></span></p>
